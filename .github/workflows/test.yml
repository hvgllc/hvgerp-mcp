name: Test

# Manual only. Every push to a pull request used to start a full run, and the
# review loop on a single branch spent more minutes than the gate was worth.
# The same checks run locally (`deno fmt --check`, `deno lint`, `deno task
# check`, `deno test --allow-all src/`), so the hosted run is kept as an
# on-demand confirmation: `gh workflow run Test --ref <branch>`.
#
# This repository is also a fork, and GitHub suppresses `push`/`pull_request`
# triggers on a fork until the owner acknowledges workflows in the Actions tab.
# `workflow_dispatch` is exempt from that suppression, so it is the trigger
# that works here without that one-time click.
on:
  workflow_dispatch:

# Một nhánh chỉ cần kết quả của lần chạy mới nhất, nên lần chạy cũ còn dở là
# phút máy tiêu cho một câu trả lời không ai đọc nữa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Check and build UI viewers
        working-directory: src/ui
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Tests
        run: deno test --allow-all src/

      - name: Release preflight (no publish)
        run: deno task release:check

name: Test

on:
  pull_request:
  push:
    branches: [main]
  # This repository is a fork, and GitHub suppresses `push`/`pull_request`
  # triggers on a fork until the owner acknowledges workflows in the Actions
  # tab. `workflow_dispatch` is exempt from that suppression, so it is the only
  # way to get a Deno test run here without that one-time click - and the local
  # route is closed too, because jsr.io answers this host with a Cloudflare
  # challenge (403) for every package the project imports.
  workflow_dispatch:

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Build UI viewers
        working-directory: src/ui
        run: |
          npm ci
          npm run build

      - name: Tests
        run: deno test --allow-all src/

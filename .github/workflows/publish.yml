name: Publish

on:
  workflow_call:
  workflow_dispatch:
  # Publishing used to be a manual step someone had to remember after creating
  # the release, and 3.1.0, 3.2.0, 3.3.0, 3.3.1, 3.3.2 and 3.3.3 are the six
  # releases where nobody did: they exist as commits and CHANGELOG entries, but
  # npm never received them, so `npm install` served 3.0.3 from 16 August until
  # 3.4.0 shipped on the 31st. Creating the release is already the
  # deliberate act the manual dispatch was standing in for, so let it be the
  # trigger. `types: [published]` keeps drafts out, and the npm step still exits
  # cleanly when the version is already on the registry, so a re-run or a
  # dispatch alongside this trigger is harmless.
  release:
    types: [published]

jobs:
  # Opt-in: this fork publishes to npm, and only to JSR once an @hvgllc scope
  # exists there. Without the guard a dispatch fails on the JSR step alone and
  # reports the whole run red even though npm published fine.
  publish-jsr:
    if: vars.PUBLISH_JSR == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build UI viewers
        run: |
          cd src/ui
          npm ci
          node build-all.mjs

      - name: Guard against Finder duplicate artifacts in dist
        run: |
          if find src/ui/dist -type d -name '* 2' | grep -q .; then
            echo "::error::Finder duplicate artifacts found in src/ui/dist — refusing to publish"
            find src/ui/dist -type d -name '* 2'
            exit 1
          fi

      - name: Publish to JSR
        run: npx jsr publish --allow-dirty

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm mints a short-lived credential from this OIDC
      # token instead of a long-lived NPM_TOKEN. Without this permission the
      # publish falls back to looking for a token and fails on 2FA.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Trusted publishing needs Node 22.14.0 at minimum; the 22 line is well past
      # that, and unlike a 22.14 pin it still satisfies the engine range current
      # npm declares for itself.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # setup-node ships the npm that came with the Node release, which is older
      # than the 11.5.1 that first understood trusted publishing.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build UI viewers
        run: |
          cd src/ui
          npm ci
          node build-all.mjs

      - name: Guard against Finder duplicate artifacts in dist
        run: |
          if find src/ui/dist -type d -name '* 2' | grep -q .; then
            echo "::error::Finder duplicate artifacts found in src/ui/dist — refusing to publish"
            find src/ui/dist -type d -name '* 2'
            exit 1
          fi

      - name: Build Node.js bundle
        run: |
          bash scripts/build-node.sh

      - name: Publish to npm
        run: |
          cd dist-node/bin
          set +e
          PUBLISH_OUTPUT=$(npm publish --access public 2>&1)
          PUBLISH_STATUS=$?
          set -e

          echo "$PUBLISH_OUTPUT"

          if [ "$PUBLISH_STATUS" -eq 0 ]; then
            exit 0
          fi

          if echo "$PUBLISH_OUTPUT" | grep -qiE "cannot publish over the previously published versions|cannot publish over previously published version|you cannot publish over"; then
            echo "Version already published, skipping"
            exit 0
          fi

          exit "$PUBLISH_STATUS"

<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HVGERP Local Test Host</title>
    <style>
    body {
      font: 14px system-ui, sans-serif;
      margin: 16px;
      color: #172033;
      background: #f5f6fa;
    }
    h1 {
      font-size: 20px;
    }
    form,
    #controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    button,
    select {
      padding: 6px 10px;
    }
    iframe {
      width: 100%;
      height: 680px;
      border: 1px solid #cbd5e1;
      background: white;
    }
    pre {
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 320px;
      background: #fff;
      padding: 12px;
    }
    #pending li {
      margin: 8px 0;
    }
    </style>
  </head>
  <body>
    <h1>Host kiểm thử local HVGERP</h1>
    <p>Chỉ dùng fixture local. Không kết nối ERPNext hoặc đọc credential.</p>
    <form method="get">
      <label>Viewer <select name="viewer" id="viewer"></select></label>
      <label>Kịch bản <select name="scenario" id="scenario"></select></label>
      <label>Biểu đồ <select name="chart" id="chart">
        <option value="bar">bar</option><option value="horizontal-bar">horizontal-bar</option>
        <option value="pie">pie</option><option value="donut">donut</option>
      </select></label>
      <button type="submit">Đặt lại</button>
    </form>
    <div id="controls">
      <button id="send-board-b" type="button" disabled>Gửi board B</button>
      <button id="send-success" type="button"
        disabled>Gửi lại dữ liệu thành công</button>
      <span id="status" role="status">Đang kết nối</span>
    </div>
    <iframe id="viewer-frame" title="Viewer đang kiểm thử"></iframe>
    <h2>Yêu cầu đang giữ</h2>
    <p>Chọn đúng ID để trả kết quả theo thứ tự mong muốn. Viewer giữ timeout thật.</p>
    <ul id="pending"></ul>
    <h2>Trace</h2>
    <pre id="trace" aria-label="Trace"></pre>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
